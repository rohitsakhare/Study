<div class="app-page login-page">
  <div class="app-card app-card--sm">
    <div class="app-brand"><span class="app-brand-dot" aria-hidden="true"></span> Angular app</div>
    <h1 class="app-title">Sign in</h1>
    <p class="app-subtitle">Use your account credentials to continue.</p>

    @if (errorMessage(); as err) {
      <p class="app-banner-error" role="alert">{{ err }}</p>
    }

    <form class="login-form" [formGroup]="loginForm" (ngSubmit)="login()" novalidate>
      <label class="app-field">
        <span class="app-label">Email</span>
        <input
          class="app-input"
          type="email"
          formControlName="email"
          autocomplete="email"
          [attr.aria-invalid]="
            loginForm.controls.email.invalid && loginForm.controls.email.touched
          "
        />
        @if (loginForm.controls.email.touched && loginForm.controls.email.errors?.['required']) {
          <span class="app-field-error">Email is required.</span>
        }
        @if (loginForm.controls.email.touched && loginForm.controls.email.errors?.['email']) {
          <span class="app-field-error">Enter a valid email address.</span>
        }
      </label>

      <label class="app-field">
        <span class="app-label">Password</span>
        <input
          class="app-input"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="
            loginForm.controls.password.invalid && loginForm.controls.password.touched
          "
        />
        @if (loginForm.controls.password.touched && loginForm.controls.password.errors?.['required']) {
          <span class="app-field-error">Password is required.</span>
        }
      </label>

      <button class="btn btn--primary" type="submit" [disabled]="loading()">
        {{ loading() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </div>
</div>
