# ===============================
# Namespace
# ===============================
apiVersion: v1
kind: Namespace
metadata:
  name: microservices
---
# ===============================
# PostgreSQL ConfigMap & Secret
# ===============================
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-config
  namespace: microservices
data:
  POSTGRES_DB: "ProductDb"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "password"
  PGDATA: "/var/lib/postgresql/data/pgdata"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
  namespace: microservices
type: Opaque
data:
  # Base64 encoded values (echo -n 'password' | base64)
  POSTGRES_PASSWORD: cGFzc3dvcmQ=  # 'password'
  POSTGRES_USER: cG9zdGdyZXM=      # 'postgres'
---
# ===============================
# PostgreSQL Persistent Volume Claim
# ===============================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-pvc
  namespace: microservices
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# ===============================
# PostgreSQL StatefulSet
# ===============================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: microservices
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
      - name: postgresql
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: postgresql-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: postgresql-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: POSTGRES_PASSWORD
        - name: PGDATA
          valueFrom:
            configMapKeyRef:
              name: postgresql-config
              key: PGDATA
        volumeMounts:
        - name: postgresql-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgresql-storage
        persistentVolumeClaim:
          claimName: postgresql-pvc
---
# ===============================
# PostgreSQL Service
# ===============================
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: microservices
spec:
  type: ClusterIP
  selector:
    app: postgresql
  ports:
  - port: 5432
    targetPort: 5432
---
# ===============================
# User Service
# ===============================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice
  namespace: microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: userservice
  template:
    metadata:
      labels:
        app: userservice
    spec:
      containers:
      - name: userservice
        image: rajesakhare/userservice:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: userservice
  namespace: microservices
spec:
  type: ClusterIP
  selector:
    app: userservice
  ports:
  - port: 80
    targetPort: 8080
---
# ===============================
# Product Service
# ===============================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productservice
  namespace: microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: productservice
  template:
    metadata:
      labels:
        app: productservice
    spec:
      containers:
      - name: productservice
        image: rajesakhare/productservice:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: ConnectionStrings__DefaultConnection
          value: "Host=postgresql.microservices.svc.cluster.local;Port=5432;Database=ProductDb;Username=postgres;Password=password"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: productservice
  namespace: microservices
spec:
  type: ClusterIP
  selector:
    app: productservice
  ports:
  - port: 80
    targetPort: 8080
---
# ===============================
# Order Service
# ===============================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderservice
  namespace: microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orderservice
  template:
    metadata:
      labels:
        app: orderservice
    spec:
      containers:
      - name: orderservice
        image: rajesakhare/orderservice:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: orderservice
  namespace: microservices
spec:
  type: ClusterIP
  selector:
    app: orderservice
  ports:
  - port: 80
    targetPort: 8080
---
# ===============================
# API Gateway
# ===============================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway
  namespace: microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apigateway
  template:
    metadata:
      labels:
        app: apigateway
    spec:
      containers:
      - name: apigateway
        image: rajesakhare/apigateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: apigateway
  namespace: microservices
spec:
  type: NodePort
  selector:
    app: apigateway
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30007
---
# ===============================
# HPA - UserService
# ===============================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: userservice-hpa
  namespace: microservices
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: userservice
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50