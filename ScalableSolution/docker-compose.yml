services:
  product-db:
    image: postgres:16.3
    container_name: product_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: productsdb
    ports:
      - "5432:5432"
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U postgres"] 
      interval: 5s 
      timeout: 5s 
      retries: 5
    volumes:
      - product_data:/var/lib/postgresql/data

  productservice:
    build:
      context: .
      dockerfile: ./ProductService/Dockerfile
    # container_name: productservice
    ports:
      - "5001-5004:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Host=product-db;Port=5432;Database=productsdb;Username=postgres;Password=postgres;"
      Jwt__Authority: "http://keycloak:8080/realms/microservices"
    depends_on:
      - product-db

volumes:
  product_data: