services:


  # =========================
  # POSTGRES DB
  # =========================
  product-db:
    image: postgres:16.3
    container_name: product_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: productsdb
    ports:
      - "5432:5432"
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U postgres"] 
      interval: 5s 
      timeout: 5s 
      retries: 5
      start_period: 10s
    volumes:
      - product_data:/var/lib/postgresql/data

  # =========================
  # REDIS
  # =========================
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =========================
  # Redis Insight
  # =========================
  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis_insight
    restart: always
    ports:
      - "8001:5540"
    depends_on:
      redis:
        condition: service_healthy

  # =========================
  # .NET API
  # =========================

  productservice:
    build:
      context: .
      dockerfile: ./ProductService/Dockerfile
    container_name: productservice
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      # DB connection
      ConnectionStrings__DefaultConnection: "Host=product-db;Port=5432;Database=productsdb;Username=postgres;Password=postgres;"
      # Redis connection
      Redis__ConnectionString: "redis:6379"
      # JWT Authentication
      Jwt__Authority: "http://keycloak:8080/realms/microservices"
    depends_on:
      product-db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  product_data: