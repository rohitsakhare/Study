version: '3.8'

services:
  # API Gateway
  apigateway:
    image: saas-platform/apigateway:latest
    container_name: api-gateway
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      - userservice
      - orderservice
      - productservice
    networks:
      - saas-network
    restart: unless-stopped

  # User Service with SQL Server
  userservice:
    image: saas-platform/userservice:latest
    container_name: user-service
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=UserServiceDb;User Id=sa;Password=YourPassword123!;
      - Jwt__Secret=your-secret-key-should-be-very-long-and-secure-at-least-32-characters
    depends_on:
      - sqlserver
    networks:
      - saas-network
    restart: unless-stopped

  # Order Service with PostgreSQL
  orderservice:
    image: saas-platform/orderservice:latest
    container_name: order-service
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=OrderServiceDb;Username=postgres;Password=YourPassword123!;
      - Jwt__Secret=your-secret-key-should-be-very-long-and-secure-at-least-32-characters
    depends_on:
      - postgres
    networks:
      - saas-network
    restart: unless-stopped

  # Product Service with MongoDB
  productservice:
    image: saas-platform/productservice:latest
    container_name: product-service
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - MongoDbSettings__ConnectionString=mongodb://mongo:27017
      - MongoDbSettings__DatabaseName=ProductServiceDb
    depends_on:
      - mongo
    networks:
      - saas-network
    restart: unless-stopped

  # SQL Server Database (for UserService)
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourPassword123!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - saas-network
    restart: unless-stopped

  # PostgreSQL Database (for OrderService)
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_PASSWORD: "YourPassword123!"
      POSTGRES_USER: postgres
      POSTGRES_DB: OrderServiceDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - saas-network
    restart: unless-stopped

  # MongoDB Database (for ProductService)
  mongo:
    image: mongo:latest
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: YourPassword123!
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - saas-network
    restart: unless-stopped

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - saas-network
    restart: unless-stopped

  # Monitoring: Prometheus (Optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - saas-network
    restart: unless-stopped

  # Monitoring: Grafana (Optional)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - saas-network
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  sqlserver_data:
  postgres_data:
  mongo_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

networks:
  saas-network:
    driver: bridge
